name: Bug report
description: Something is broken in GenoLens (local app or docs).
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach genotype files, `data/` paths, or other private genetic data.
        Reports are exploratory only — not medical advice.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach genotype data or other private genetic files.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, how you run API/web (or Streamlit).
      placeholder: |
        macOS / Python 3.12 / Node 20
        uvicorn api.main:app + npm run dev
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted error messages or stack traces if useful.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Optional screenshots of the UI (no genome content).
