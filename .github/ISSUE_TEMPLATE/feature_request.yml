name: Feature request
description: Propose an improvement that fits GenoLens’s local, privacy-first model.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features must keep genomes on disk by default. Relatives stay selection-driven
        (no auto N×N over every file in `data/`). Reports remain exploratory / non-clinical.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach genotype data or other private genetic files.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should GenoLens behave?
    validations:
      required: true
  - type: textarea
    id: privacy_impact
    attributes:
      label: Privacy / product impact
      description: Does this touch genomes, uploads, relatives selection, or medical wording?
      placeholder: No upload path; selection-driven relatives; exploratory copy only.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
