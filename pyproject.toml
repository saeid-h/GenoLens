[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genolens"
version = "0.1.0"
description = "Local 23andMe viewer for health markers, relatedness, ancestry, and ancient DNA affinity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saeed Hoss" }]
dependencies = [
  "snps>=2.12.0",
  "lineage>=4.4.0",
  "streamlit>=1.28.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "plotly>=5.18.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
# ezancestry requires Python<3.12, pandas<2, numpy<2 — conflicts with the default
# Streamlit stack. GenoLens ships a bundled AIM likelihood instead; use this extra
# only in a separate 3.10/3.11 environment if you want snps.predict_ancestry.
ancestry = ["ezancestry>=0.1.0", "pandas>=1.3.2,<2.0.0", "numpy>=1.21.2,<2.0.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
genolens = "genolens.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genolens*"]

[tool.setuptools.package-data]
genolens = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
